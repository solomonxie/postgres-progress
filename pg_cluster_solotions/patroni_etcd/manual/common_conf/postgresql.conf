########################################################################
#  This config is a placeholder only for initially start pg server,    #
#  then later Patroni will completely take over (override) this config #
########################################################################

listen_addresses = '*'
port = 5432
max_connections = 256
password_encryption = md5
shared_buffers = 32GB
work_mem = 64MB
effective_cache_size = 90GB
maintenance_work_mem = 2GB

statement_timeout = 0

data_directory = '/mnt/pg_data/data'

# wal_level controlls how many WAL logs generated: replica|logical|minimal, if we need replication then it needs more logs
wal_level = logical
# hot_standby=on will mark this as a `standby` node, and only allows SELECT but NOT INSERT/UPDATE/DELETE
hot_standby = off
wal_keep_size = 5GB
max_wal_senders = 5
max_replication_slots = 5
# synchronous_commit: (slow) make sure it's not sync replica mode otherwise every single DDL will be locked
synchronous_commit = off
# synchronous_standby_names defines what nodes it needs to wait for ack before completing the write operation (slow)
synchronous_standby_names = '*'

# Logs
logging_collector = on
log_directory = '/var/log/postgresql'
log_filename = 'postgresql.log'
log_file_mode = 0600
log_rotation_age = 1d
log_rotation_size = 1GB
log_truncate_on_rotation = off

log_connections = on
log_disconnections = on
log_duration = off  # will print a log line just show duration itself
log_statement = 'ddl'  # none|ddl|mod|all  < log this EXCEPT duration >= log_min_duration_statement
log_min_duration_statement = 50  # ms. Logs queries taking longer than this
# log_line_prefix = '%m [%p] %a '  # Timestamp, PID, Application Name
log_line_prefix = '%m [%p] DB:%d User:%u IP:%h '
log_parameter_max_length = 512  # Prevent logging SQL that's too long

log_min_duration_sample = 100  # ms
log_statement_sample_rate = 0.5


#######################################################################
#                             EXTENSIONS                              #
#######################################################################

# REF: https://www.postgresql.org/docs/current/pgstatstatements.html
shared_preload_libraries = 'pg_stat_statements'
compute_query_id = on
pg_stat_statements.track = all
pg_stat_statements.max = 10000
pg_stat_statements.save = on
