# Placeholder inventory. Fill in real addresses (e.g. from
# `terraform output` in ../terraform/) before running the playbook.
# The host names below (node1, node2, node3) drive the per-node values
# rendered into each role's templates (etcd.conf.yml.j2, patroni.yml.j2).

[etcd_nodes]
# node1 is the bootstrap node (first in this group): it forms the
# initial etcd cluster alone and gets a longer heartbeat/election
# timeout since it has no peers to time out against yet.
node1 ansible_host=10.0.1.11 etcd_heartbeat_interval=1000 etcd_election_timeout=5000
node2 ansible_host=10.0.1.12
node3 ansible_host=10.0.1.13

# node1 and node2 run PostgreSQL, Patroni, and pgbouncer.
[pg_nodes]
node1
node2

# node3 runs HAProxy and pgAdmin.
[proxy_nodes]
node3

[all:vars]
ansible_user=ec2-user
ansible_ssh_private_key_file=~/.ssh/your-key.pem
ansible_python_interpreter=/usr/bin/python3
