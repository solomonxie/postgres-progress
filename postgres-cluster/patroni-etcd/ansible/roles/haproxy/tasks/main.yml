---
# Mirrors ../../manual/node3_conf/setup_haproxy.sh, adapted to this
# role's own template instead of ../../manual/.

- name: Install HAProxy
  apt:
    name: haproxy
    state: present
    update_cache: true

- name: Deploy haproxy.cfg
  template:
    src: haproxy.cfg.j2
    dest: /etc/haproxy/haproxy.cfg

- name: Enable and restart HAProxy
  systemd:
    name: haproxy
    enabled: true
    state: restarted
    daemon_reload: true
